name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: brain-models-${{ hashFiles('src/ai/config.ts', 'package-lock.json') }}
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run tokens:lint
      - name: Full Playwright matrix (WebGL path)
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - name: Lighthouse CI, desktop and mobile presets
        run: |
          LH_PRESET=desktop npm run lighthouse
          LH_PRESET=mobile npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
