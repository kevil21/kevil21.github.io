name: Validate static portfolio
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache/restore@v6
        with:
          path: .cache/atlas-models
          key: atlas-minilm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'src/ai/models.ts', 'scripts/build-semantic.ts') }}
      - run: npm ci
      - run: npm run validate
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
        env:
          ATLAS_TEST_PORT: '4337'
          ATLAS_TEST_SKIP_BUILD: '1'
      - run: npm run audit:public