name: Manual browser and Lighthouse quality audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.9.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache/restore@v6
        with:
          path: .cache/atlas-models
          key: atlas-minilm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'src/ai/models.ts', 'scripts/build-semantic.ts') }}
      - run: npm ci
      - run: npm run validate
      - run: node scripts/validate-html.mjs
      - run: npm exec playwright install --with-deps chromium firefox webkit
      - run: npm exec playwright test -- --config playwright.smoke.config.ts --workers=2
        env:
          ATLAS_TEST_PORT: '4345'
          ATLAS_TEST_SKIP_BUILD: '1'
      # No browser suite/build in parallel with the serial Lighthouse matrix.
      - run: node scripts/performance.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: local-quality-reports
          path: |
            performance-results/
            test-results/smoke/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false